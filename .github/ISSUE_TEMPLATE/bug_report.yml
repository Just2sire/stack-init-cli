name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        A minimal `stack-init.yaml` that reproduces the issue is the fastest way to get a fix.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: yaml
    attributes:
      label: Your stack-init.yaml (or a minimal reproduction)
      description: Paste the relevant parts of your YAML file.
      render: yaml

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      placeholder: "stack-init generate"
      render: bash

  - type: textarea
    id: output
    attributes:
      label: Error output or unexpected result
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node -v output, e.g. v20.11.0"

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11, macOS 14, Ubuntu 22..."
